<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shell Field / Library connection</title><style>body{font:16px Arial;max-width:620px;margin:10vh auto;padding:24px;color:#0648ff}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block}button{cursor:pointer}</style><h1>Library connection</h1><p>Enter your separate owner-access key, not your GitHub token. The key is sent only to this site's server and is not saved by this page.</p><form id="check"><label>Owner-access key<input id="key" type="password" autocomplete="off" required maxlength="512"></label><button>CHECK GITHUB CONNECTION</button></form><pre id="result" role="status"></pre><script>document.getElementById('check').addEventListener('submit',async event=>{event.preventDefault();const button=event.currentTarget.querySelector('button'),input=document.getElementById('key'),result=document.getElementById('result');button.disabled=true;result.textContent='Checking…';try{const response=await fetch('/api/library-status',{method:'POST',headers:{Authorization:'Bearer '+input.value}});const data=await response.json();result.textContent=JSON.stringify(data,null,2);}catch{result.textContent='Connection check failed.';}finally{input.value='';button.disabled=false;}});</script></html>
